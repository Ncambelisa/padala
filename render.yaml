# Free, non-production Render staging environment.
#
# This deployment is deliberately for fictional test data only. Its free web
# services can sleep and its free PostgreSQL instance expires. It has no paid
# subscriptions, email delivery, OCR, malware scanner, persistent file storage,
# or production privacy configuration. Never promote it to a public launch.
services:
  - type: web
    name: padala-nico-staging-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PADALA_ENV
        value: staging
      - key: DATA_DIR
        value: /tmp/padala-staging
      - key: PUBLIC_APP_HOST
        fromService:
          name: padala-nico-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: padala-nico-staging-db
          property: connectionString
      - key: SECURE_COOKIES
        value: 'false'
      - key: EMAIL_VERIFICATION_REQUIRED
        value: 'false'
      - key: EMAIL_WORKER_ENABLED
        value: 'false'
      - key: BILLING_ENABLED
        value: 'false'
      - key: BILLING_ENFORCEMENT_ENABLED
        value: 'false'

  - type: web
    name: padala-nico-staging-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: API_INTERNAL_HOSTPORT
        fromService:
          name: padala-nico-staging-api
          type: web
          property: hostport

databases:
  - name: padala-nico-staging-db
    databaseName: padala_staging
    user: padala_staging
    plan: free
    region: singapore
    ipAllowList: []
